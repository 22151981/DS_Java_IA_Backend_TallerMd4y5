# Puerto de la aplicación (Render asigna la variable PORT)
server.port=${PORT:8080}

# Base de datos local (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Importación opcional de secretos locales
spring.config.import=optional:file:secrets.properties

# Parámetros y constantes de negocio de Sillón
sillon.zona-horaria=America/Bogota
sillon.url.publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.limite.estilistas-gratis=2

# URLs configurables para pruebas y simuladores del calificador
stripe.url.api=${STRIPE_URL_API:https://api.stripe.com}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
sillon.ia.openai.clave=${GEMINI_LLAVE:llave_dummy}
sillon.ia.openai.modelo=${SILLON_IA_OPENAI_MODELO:gemini-2.5-flash}
sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com/v1/messages}
sillon.ia.claude.clave=${CLAUDE_LLAVE:}
sillon.ia.claude.modelo=${SILLON_IA_CLAUDE_MODELO:claude-3-5-haiku-latest}

# Valores de secretos con valores de relleno para que siempre arranque la app
jwt.secreto=${JWT_SECRETO:secreto_por_defecto_para_desarrollo_sillon_minimo_32_chars}
stripe.clave.secreta=${STRIPE_CLAVE_SECRETA:sk_test_dummy}
stripe.secreto.webhook=${STRIPE_SECRETO_WEBHOOK:whsec_dummy}
stripe.precio.pro=${STRIPE_PRECIO_PRO:price_pro_dummy}
stripe.precio.creditos=${STRIPE_PRECIO_CREDITOS:price_creditos_dummy}
gemini.llave=${GEMINI_LLAVE:placeholder_gemini_key}