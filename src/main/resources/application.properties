# Puerto de la aplicación (Render asigna la variable PORT)
server.port=${PORT:8080}

# Base de datos local (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Importación opcional de secretos locales
spring.config.import=optional:file:secrets.properties

# Parámetros y constantes de negocio de Sillón
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.limite.estilistas-gratis=2

# URLs configurables para pruebas y simuladores del calificador
STRIPE_URL_API=${STRIPE_URL_API:https://api.stripe.com}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

# Valores de secretos con valores de relleno para que siempre arranque la app
jwt.secreto=${JWT_SECRETO:secreto_por_defecto_para_desarrollo_sillon_minimo_32_chars}
stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
stripe.precio.pro=${STRIPE_PRECIO_PRO:price_placeholder_pro}
stripe.precio.creditos=${STRIPE_PRECIO_CREDITOS:price_placeholder_creditos}
gemini.llave=${GEMINI_LLAVE:placeholder_gemini_key}